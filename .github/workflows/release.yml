name: release

# Build a universal macOS .app/.dmg and publish a GitHub release when a
# version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: bun install

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri-nspanel is a git dependency; fetch via git CLI over HTTPS.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "QuickMemo ${{ github.ref_name }}"
          releaseBody: |
            QuickMemo — fast menu-bar note capture for macOS.

            Download the `.dmg` below. On first launch, right-click the app →
            Open (unsigned build), or install via Homebrew (see the README).
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin

      - name: Update Homebrew tap cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Hash the just-published universal dmg.
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p '*_universal.dmg' -O qm.dmg
          SHA="$(shasum -a 256 qm.dmg | awk '{print $1}')"

          # Render the cask from the repo template (url uses #{version}).
          sed -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
              packaging/quickmemo.rb > cask.rb

          # Push to the tap repo via the write deploy key.
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=no"
          git clone git@github.com:bachdx2812/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp cask.rb tap/Casks/quickmemo.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/quickmemo.rb
          git commit -m "chore: quickmemo ${VERSION}" || { echo "no changes"; exit 0; }
          git push origin HEAD:main
