name: tap-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tap deploy key write access
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=no"
          git clone git@github.com:bachdx2812/homebrew-tap.git tap
          cd tap
          git config user.name ci
          git config user.email ci@example.com
          git push --dry-run origin HEAD:main
          echo "DEPLOY KEY WRITE OK"
